<!-- 役判定・上がり判定・向聴数・点（id="logic" の script・DOMに触らない純粋関数）：window.TojiMJ（Node では globalThis.TojiMJ）
     牌は 0〜33 の番号：0〜8 紅1〜9／9〜17 緑1〜9／18〜26 藍1〜9／27〜30 風牌 上槽・濾過・火入れ・貯蔵／31〜33 三元牌 米・米こうじ・水
     closed＝手の中の牌の配列（順不同）、melds＝鳴いた組の配列 [{kind:"kotsu"|"shuntsu", r:先頭の牌}]（無ければ [] か省略）。closed は 14−3×組の数 枚で上がりを判定
     decompositions(closed, melds) → [{pair:r, sets:[{kind, r, open?}]×4（鳴いた組を含む）} | {special:"musou", sets:[]}]（上がり形でなければ []）
     isWin(closed, melds) → true/false
     evaluate(closed, melds) → null | {pts:役の点の合計, man:役満か, yaku:[{id,name,note,n:回数,pt:点}], deco:点が最大の分け方}（画面の点＝pts×10）
     shanten(closed, melds) → 向聴数（−1＝上がり・0＝聴牌。通常形と、鳴いていないときは杜氏無双形の小さい方）
     bestDiscards(closed, melds) → {sh:捨てたあとの向聴数, tiles:[そこまで下がる牌の種類]}（closed は 3n+2 枚）
     canPon(closed, t) / chiOptions(closed, t) → [[手から出す2枚]…] / afterCall(closed, melds, t, use, kind) → {closed, melds}
     cpuCall(closed, melds, t, {pon, chi}) → null | {kind, use}（鳴いて向聴数が下がるときだけ）
     payments(pts, winner, from) → [4人の増減]（from＝捨てた人。ツモは null）／newWall(rnd) → 136枚を混ぜた配列／mulberry32(seed) → 乱数
     役の定義は YAKU 配列（名前・条件・説明は docs/spec.md の役表どおり）。CPU の間は下の script の CPU_MS -->
<!-- 注意：題名のドット文字（下の @font-face "TojiTitle"）は「杜氏麻雀」の4字だけに絞って埋め込んである。
     題名を変えたら新しい字は欠けて明朝に化ける。作り直すこと（woff2 にするには brotli が要る。無ければ woff で可）：
     pyftsubset DotGothic16-Regular.ttf --text="<新しい題名>" --flavor=woff --layout-features='' --no-hinting --output-file=title.woff  → base64 にして差し替え -->

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;height:100%;overflow:hidden;color:var(--text);
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0;z-index:-1;image-rendering:pixelated;
  background:linear-gradient(rgba(12,24,48,.25),rgba(12,24,48,.25)),var(--kura) center top/cover no-repeat,var(--bg)}
#app{height:100vh;display:flex;flex-direction:column;max-width:420px;margin:0 auto;padding:0 8px calc(8px + env(safe-area-inset-bottom))}
@supports(height:100dvh){#app{height:100dvh}}
header{display:flex;align-items:center;justify-content:space-between;height:34px;flex:none}
header h1{font-family:"TojiTitle","Hiragino Mincho ProN","Yu Mincho",serif;font-size:16px;margin:0;font-weight:normal;letter-spacing:.06em;cursor:pointer;white-space:nowrap}
header .btns{display:flex;align-items:center}
header .btns button{font:inherit;font-size:13px;color:var(--text);background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:4px 7px;margin-left:6px;white-space:nowrap}
header .btns #snd{padding:2px 6px;font-size:16px;line-height:1.2;position:relative;z-index:14}
/* 牌：数字（タンクの色）＋工程のピクト＋小さく工程名。字牌はピクト＋名前 */
.tile{--tc:var(--kz);position:relative;flex:none;width:var(--cw);height:calc(var(--cw) * 1.4);border-radius:5px;background:var(--card);color:var(--ink);
  border:1px solid #fff;box-shadow:0 1px 0 #c9c2b2,0 2px 0 #9b9384,0 3px 4px rgba(0,0,0,.5);overflow:hidden;transition:transform .08s}
.tile.k0{--tc:var(--k0)} .tile.k1{--tc:var(--k1)} .tile.k2{--tc:var(--k2)}
.tile .no{position:absolute;top:2px;left:3px;font-size:calc(var(--cw) * .36);font-weight:700;line-height:1;color:var(--tc);font-family:"Hiragino Sans","Yu Gothic",sans-serif}
.tile .ic{position:absolute;left:50%;top:calc(var(--cw) * .38);width:calc(var(--cw) * .5);height:calc(var(--cw) * .5);transform:translateX(-50%);color:var(--tc)}
.tile .nm{position:absolute;bottom:calc(var(--cw) * .06);left:0;right:0;text-align:center;font-weight:700;font-size:calc(var(--cw) * .28);line-height:1;letter-spacing:-.06em;white-space:nowrap;font-feature-settings:"palt";color:#4a443c}
.tile.hz .ic{top:calc(var(--cw) * .16);width:calc(var(--cw) * .68);height:calc(var(--cw) * .68)}
.tile.hz .nm{font-size:calc(var(--cw) * .24);color:var(--ink)}
.tile.mini{border-radius:2px;border-width:0;box-shadow:0 1px 0 #9b9384}
.tile.mini .nm{display:none}
.tile.mini .no{top:1px;left:1px;font-size:calc(var(--cw) * .5)}
.tile.mini .ic{top:auto;bottom:calc(var(--cw) * .06);left:auto;right:0;transform:none;width:calc(var(--cw) * .66);height:calc(var(--cw) * .66)}
.tile.mini.hz .ic{left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%);width:calc(var(--cw) * .82);height:calc(var(--cw) * .82)}
.tile.last{box-shadow:0 0 0 2px #ffd76a}
/* 中央の盤（縦の案A）：四隅＝鳴いた組（上→左上・右→右上・左→左下・自分→右下）、上下＝捨て牌、左右＝横向きの捨て牌。
   --pw は fit() が決める。--th＝捨て牌の高さ。左右の列の幅と上下の段の高さは 4×(th+1)、真ん中は 6×(pw+1) の正方形 */
#mid{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#board{--th:calc(var(--pw) * 1.36);display:grid;gap:3px;grid-template-areas:"tl t tr" "l c r" "bl b br";
  grid-template-columns:calc((var(--th) + 1px) * 4) calc((var(--pw) + 1px) * 6) calc((var(--th) + 1px) * 4);
  grid-template-rows:calc((var(--th) + 1px) * 4) calc((var(--pw) + 1px) * 6) calc((var(--th) + 1px) * 4)}
.pond{display:grid;gap:1px;--cw:var(--pw)}
.pond .tile{width:var(--pw);height:var(--th)}
#pT,#pB{grid-template-columns:repeat(6, var(--pw));grid-auto-rows:var(--th)}
#pT{grid-area:t;align-self:end;align-content:end} #pB{grid-area:b;align-content:start}
#pL,#pR{grid-template-rows:repeat(6, var(--pw));grid-auto-columns:var(--th)}
#pL{grid-area:l;justify-self:end;justify-content:end} #pR{grid-area:r;justify-content:start}
/* 横向き：枠（横長）の真ん中に牌を置いて回す。左の人は90度・右の人は−90度 */
.rot{position:relative;width:calc(var(--cw) * 1.36);height:var(--cw)}
.rot .tile{position:absolute;left:50%;top:50%;width:var(--cw);height:calc(var(--cw) * 1.36)}
.rot.L .tile{transform:translate(-50%,-50%) rotate(90deg)}
.rot.R .tile{transform:translate(-50%,-50%) rotate(-90deg)}
.mc{display:flex;gap:3px;--cw:max(12px, calc(var(--pw) * .8))}
.mc .m{display:flex}
.mc .tile.mini{height:calc(var(--cw) * 1.36)}
#mT{grid-area:tl;flex-direction:column;align-items:flex-start;justify-content:flex-end}
#mR{grid-area:tr;flex-direction:row-reverse;align-items:flex-end;justify-content:flex-start}
#mR .m,#mL .m{flex-direction:column}
#mL{grid-area:bl;flex-direction:row;align-items:flex-start;justify-content:flex-start}
#myM{grid-area:br;flex-direction:column;align-items:flex-end;justify-content:flex-end;--cw:max(14px, calc(var(--pw) * .9))}
#ctr{grid-area:c;display:grid;grid-template-columns:1fr auto 1fr;column-gap:4px;padding:0 2px;grid-template-rows:1fr auto 1fr;align-items:center;justify-items:center;
  background:rgba(8,18,40,.55);border:1px solid rgba(255,255,255,.18);border-radius:6px;font-size:11px;line-height:1.25;font-variant-numeric:tabular-nums;text-align:center}
#ctr .sc{white-space:nowrap}
#ctr .sc b{font-size:12px}
#ctr .sc.turn{color:#ffd76a}
#sT{grid-column:1 / 4;grid-row:1} #sB{grid-column:1 / 4;grid-row:3} #sL{grid-column:1;grid-row:2} #sR{grid-column:3;grid-row:2}
#cMid{grid-column:2;grid-row:2;font-size:11px;white-space:nowrap}
#cMid b{display:block;font-size:13px}
/* ボタンの列（手牌のすぐ上・右寄せ。案内の1行も同じ列の左） */
#bar{flex:none;height:48px;padding-top:4px;display:flex;align-items:center;gap:6px}
#note{font-size:13px;white-space:nowrap}
#acts{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
/* 手牌（2段×7。引いた牌はいつも2段目の右端） */
#hand{flex:none;display:flex;flex-direction:column;gap:6px;align-items:center;height:calc(var(--cw) * 2.8 + 14px);padding-top:8px}
#hand .r{display:flex;gap:var(--gap);width:calc(var(--cw) * 7 + var(--gap) * 6 + 8px)}
#hand .tile{cursor:pointer}
#hand .tile.up{transform:translateY(-8px);box-shadow:0 0 0 2px #ffd76a,0 6px 8px rgba(0,0,0,.5)}
#hand .tile.drawn{margin-left:auto}
#acts button{font:inherit;font-size:16px;height:44px;min-width:64px;padding:0 12px;border-radius:22px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:var(--text);display:flex;align-items:center;gap:2px;white-space:nowrap}
#acts button.win{background:#c0392b;border-color:#c0392b;box-shadow:0 2px 0 #1c140c;animation:glow 1.2s ease-in-out infinite alternate}
#acts button.call{background:#f3efe3;color:var(--ink);border-color:#f3efe3}
#acts button.v{padding:0 7px;min-width:0}
#acts button .tile{--cw:16px;margin-left:1px}
#acts button .tile.got{box-shadow:0 0 0 2px #ffd76a}

.ov{position:fixed;inset:0;z-index:15;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:6px}
.ov.on{display:flex}

.ov p.sub{font-size:14px;margin:0 0 8px;color:#555}
.ov p.tm{font-size:26px;margin:6px 0 6px;font-weight:700;font-variant-numeric:tabular-nums}
.ov p.calc{font-size:13px;color:#555;margin:6px 0 0}

#groups{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 6px;margin:0 0 10px}

#groups .g.open{background:#e9e2d2}
#groups .tile{--cw:22px;box-shadow:0 1px 0 #9b9384;border:1px solid #ddd6c6}
.yl{list-style:none;margin:0;padding:0;text-align:left}
.yl li{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:5px 2px;border-top:1px solid #e4ded0;font-size:15px}
.yl li:first-child{border-top:0}
.yl li .pt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.yl li small{grid-column:1 / -1;font-size:12px;color:#555}
.mv{width:100%;border-collapse:collapse;font-size:14px;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.mv td{padding:3px 4px;border-top:1px solid #e4ded0}
.mv td:first-child{text-align:left}
.mv td:last-child{text-align:right;width:4.5em}
.mv td.p{color:#1d6b3a;font-weight:700} .mv td.n{color:#b0262b}
.mv tr.me td{font-weight:700}

<script id="logic">
// ===== 牌（工程名は toji-solitaire/docs/process_verification.md の確定案。一字も変えない） =====
// 番号 0〜33：0〜8 紅1〜9／9〜17 緑1〜9／18〜26 藍1〜9／27〜30 風牌（上槽・濾過・火入れ・貯蔵）／31〜33 三元牌（米・米こうじ・水）
const NUMS = ["精米","洗米","浸漬","蒸し","製麹","酒母","初添","仲添","留添"];
const HONORS = ["上槽","濾過","火入れ","貯蔵","米","米こうじ","水"];
const TANKS = ["紅","緑","藍"];   // 色に醸造上の意味は持たせない（一号・二号・三号）
// ===== 役（名前・条件・説明・点はここだけ。docs/spec.md の役表どおり・一字も変えない。cond は画面の言い方で判定は test説明「なし」は note:"" ） =====
// test(c) の c：{counts:全34種の枚数（鳴いた組も含む）, sets:[{kind,r,open}]×4, pair:r, special}。数を返す（0＝つかない・n＝n回）
// man:true は役満（他の役と足さない）
const isHonor = t => t >= 27;
const numOf = t => t % 9;            // 数牌の 0〜8（1〜9）
const tankOf = t => (t / 9) | 0;     // 0〜2（字牌は 3）
const YAKU = [
  {id:"agari",    name:"上がり",           cond:"4組＋同じ2枚がそろう", note:"", pt:1, test:c => 1},
  {id:"jihai",    name:"字牌の刻子",       cond:"数字のない牌を同じ3枚（1組ごとに）", note:"", pt:1,
    test:c => c.sets.filter(s => s.kind === "kotsu" && isHonor(s.r)).length},
  {id:"sandan",   name:"三段仕込み",       cond:"同じ色の7・8・9（何組あっても1回）", note:"三回に分けて仕込む", pt:2,
    test:c => c.sets.some(s => s.kind === "shuntsu" && numOf(s.r) === 6) ? 1 : 0},
  {id:"genryo",   name:"原料処理",         cond:"1・2・3・4がそろう（色は問わない）", note:"精米・洗米・浸漬・蒸しの蒸米づくり", pt:2,
    test:c => [0,1,2,3].every(v => c.counts[v] + c.counts[9 + v] + c.counts[18 + v] > 0) ? 1 : 0},
  {id:"sanshoku", name:"三色同順",         cond:"紅・緑・藍で同じ続き番号の組", note:"", pt:3,
    test:c => [0,1,2,3,4,5,6].some(v => [0,1,2].every(k => c.sets.some(s => s.kind === "shuntsu" && s.r === k * 9 + v))) ? 1 : 0},
  {id:"ittsu",    name:"精米から留添まで", cond:"同じ色で 1・2・3／4・5・6／7・8・9 の三組", note:"精米から留添まで一色でそろえる", pt:4,
    test:c => [0,1,2].some(k => [0,3,6].every(v => c.sets.some(s => s.kind === "shuntsu" && s.r === k * 9 + v))) ? 1 : 0},
  {id:"toitoi",   name:"対々",             cond:"組が4つとも同じ牌3枚", note:"同じ牌三枚の組が四つ", pt:4,
    test:c => c.sets.every(s => s.kind === "kotsu") ? 1 : 0},
  {id:"honitsu",  name:"混一色",           cond:"紅・緑・藍のどれか1色＋数字のない牌だけ", note:"", pt:3,
    test:c => (tanksIn(c.counts) === 1 && c.counts.slice(27).some(v => v > 0)) ? 1 : 0},
  {id:"chinitsu", name:"清一色",           cond:"紅・緑・藍のどれか1色だけ", note:"", pt:6,
    test:c => (tanksIn(c.counts) === 1 && c.counts.slice(27).every(v => v === 0)) ? 1 : 0},
  {id:"daisan",   name:"清酒の原料（役満）", cond:"米・米こうじ・水を3枚ずつ", note:"米・米こうじ・水を原料に発酵させこす", pt:13, man:true,
    test:c => [31,32,33].every(t => c.sets.some(s => s.kind === "kotsu" && s.r === t)) ? 1 : 0},
  {id:"kaze",     name:"上槽から貯蔵（役満）", cond:"上槽〜貯蔵で3枚ずつ3組＋2枚（4組でも）", note:"一般的な、搾りから貯蔵までの流れ", pt:13, man:true,
    test:c => { const k = c.sets.filter(s => s.kind === "kotsu" && s.r >= 27 && s.r <= 30).length;
      return (k === 4 || (k === 3 && c.pair >= 27 && c.pair <= 30)) ? 1 : 0; }},
  {id:"musou",    name:"杜氏無双（役満）", cond:"1色の1〜9と上槽〜貯蔵を1枚ずつ＋どれか1枚", note:"蔵人の長・杜氏として全工程をそろえる", pt:13, man:true,
    test:c => c.special === "musou" ? 1 : 0},
];
function tanksIn(counts){ let n = 0; for (let k = 0; k < 3; k++){ for (let v = 0; v < 9; v++) if (counts[k * 9 + v]){ n++; break; } } return n; }

(function(root){
  const N = 34;
  function mulberry32(a){ a = a >>> 0; return function(){ a = (a + 0x6D2B79F5) >>> 0; let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const nameOf = t => t < 27 ? NUMS[numOf(t)] : HONORS[t - 27];
  const canSeq = r => r < 27 && numOf(r) <= 6;      // r から始まる順の組が作れるか（9→1 はつながらない・字牌は不可）
  const meldTiles = m => m.kind === "kotsu" ? [m.r, m.r, m.r] : [m.r, m.r + 1, m.r + 2];
  // 牌の配列 → 34種の枚数（不正な番号・5枚以上は null）
  function countsOf(tiles){
    const c = new Array(N).fill(0);
    for (const t of tiles){ if (!Number.isInteger(t) || t < 0 || t >= N) return null; c[t]++; }
    return c.every(v => v <= 4) ? c : null;
  }
  // 手牌＋鳴いた組を合わせた枚数
  function allCounts(closed, melds){
    const all = closed.slice(); for (const m of melds || []) all.push(...meldTiles(m));
    return countsOf(all);
  }
  // 残りの牌を組（刻子・順の組）だけに分ける分け方を全部（一番小さい牌から決めるので重複しない）
  function setsOnly(c, from, acc, out, banK){
    let r = from; while (r < N && c[r] === 0) r++;
    if (r === N){ out.push(acc.slice()); return; }
    if (c[r] >= 3 && r !== banK){ c[r] -= 3; acc.push({kind:"kotsu", r}); setsOnly(c, r, acc, out, -1); acc.pop(); c[r] += 3; }
    if (canSeq(r) && c[r + 1] > 0 && c[r + 2] > 0){
      c[r]--; c[r + 1]--; c[r + 2]--; acc.push({kind:"shuntsu", r});
      setsOnly(c, r, acc, out, r);
      acc.pop(); c[r]++; c[r + 1]++; c[r + 2]++;
    }
  }
  // 杜氏無双の形か（鳴いていない14枚・1つのタンクの1〜9＋風牌4種を1枚ずつ＋そのどれか1枚）
  function isMusou(c){
    for (let k = 0; k < 3; k++){
      const kinds = [...Array(9).keys()].map(v => k * 9 + v).concat([27,28,29,30]);
      let tot = 0; for (const t of kinds) tot += c[t];
      if (tot === 14 && kinds.every(t => c[t] >= 1)) return true;
    }
    return false;
  }
  function decompositions(closed, melds){
    melds = melds || [];
    if (!Array.isArray(closed) || melds.length > 4 || closed.length !== 14 - 3 * melds.length) return [];
    const c = countsOf(closed); if (!c || !allCounts(closed, melds)) return [];
    const open = melds.map(m => ({kind:m.kind, r:m.r, open:true}));
    const out = [];
    for (let p = 0; p < N; p++){
      if (c[p] < 2) continue;
      c[p] -= 2;
      const ss = []; setsOnly(c, 0, [], ss, -1);
      for (const sets of ss) out.push({pair:p, sets:open.concat(sets)});
      c[p] += 2;
    }
    if (!melds.length && isMusou(c)) out.push({special:"musou", sets:[]});
    return out;
  }
  const isWin = (closed, melds) => decompositions(closed, melds).length > 0;
  function yakuOf(deco, counts){
    const ctx = {counts, sets:deco.sets || [], pair:deco.pair, special:deco.special};
    const hit = YAKU.map(y => ({y, n:y.test(ctx)})).filter(h => h.n > 0);
    const man = hit.filter(h => h.y.man);
    const use = man.length ? man : hit;
    const yaku = use.map(h => ({id:h.y.id, name:h.y.name, note:h.y.note, n:h.n, pt:h.y.pt * h.n}));
    return {pts:yaku.reduce((s, y) => s + y.pt, 0), man:man.length > 0, yaku, deco};
  }

<!-- 音（Web Audio 合成・外部ファイルなし）。酒器おとしの SakeSound の作りを流用（杜氏ソリティア経由・BGMは外した）。ゲームの進行には触れない -->
<script>
(function () {

  ['pointerup', 'touchend', 'click', 'keydown'].forEach(function (t) { document.addEventListener(t, unlock, true); });

  function paintBtn() { btn.textContent = on ? '🔈' : '🔇'; btn.setAttribute('aria-label', on ? '音を消す' : '音を出す'); }
  paintBtn();
  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    on = !on;
    try { localStorage.setItem(KEY, on ? '1' : '0'); } catch (err) {}
    paintBtn();

      var t = ac.currentTime;

      master.gain.setTargetAtTime(on ? 0.8 : 0, t, 0.03);
    }

    draw: function () { play(SE.draw); },
    discard: function () { play(SE.discard); },
    win: function () { play(SE.win); },
    flow: function () { play(SE.flow); }
  };
})();

<script>

  }
  function rotEl(el, dir){ const w = document.createElement("div"); w.className = "rot " + dir; w.appendChild(el); return w; }
  function meldEl(m, cls, dir){
    const d = document.createElement("div"); d.className = "m";
    T.meldTiles(m).forEach(x => { const el = tileEl(x, cls); d.appendChild(dir ? rotEl(el, dir) : el); });
    return d;
  }
  // ----- 描く -----
  const POND = ["pB", "pR", "pT", "pL"], SC = ["sB", "sR", "sT", "sL"];
  function render(){
    if (!G || !G.R) return;
    const R = G.R;
    $("cMid").innerHTML = `<b>${KYOKU[G.round]}</b>残り ${R.wall.length}`;
    for (let s = 0; s < 4; s++){
      const el = $(SC[s]);
      el.className = "sc" + (R.turn === s ? " turn" : "");
      el.innerHTML = `${WHO[s]}${s === 1 || s === 3 ? "<br>" : " "}<b>${G.scores[s]}</b>`;
      // 捨て牌：1列目は真ん中のそば。各人から見て左から右へ並べ、6枚で折り返して外側へ（上の人は右から左・上へ積む。牌の字は回さない）。左右の人は横向き
      const pd = $(POND[s]), a = R.P[s].pond, L = Math.max(4, Math.ceil(a.length / 6));
      pd.innerHTML = "";
      a.forEach((t, i) => {
        const k = (i / 6) | 0, j = i % 6;
        const [r, c] = s === 0 ? [k + 1, j + 1] : s === 2 ? [L - k, 6 - j] : s === 3 ? [j + 1, L - k] : [6 - j, k + 1];
        const el = tileEl(t, "mini" + (R.last && R.last.p === s && i === a.length - 1 ? " last" : ""));
        const cell = s === 1 || s === 3 ? rotEl(el, s === 3 ? "L" : "R") : el;
        cell.style.gridRow = r; cell.style.gridColumn = c;
        pd.appendChild(cell);
      });
    }
    // 鳴いた組：盤の四隅（左右の人の組は横向き）
    [["myM", 0], ["mR", 1], ["mT", 2], ["mL", 3]].forEach(([id, s]) => {
      const me = $(id); me.innerHTML = "";
      R.P[s].melds.forEach(md => me.appendChild(meldEl(md, "mini", s === 1 ? "R" : s === 3 ? "L" : null)));
    });
    renderHand();
  }
  function myTurn(){ return pending && G && G.R && G.R.turn === 0 && (G.R.P[0].drawn !== null || G.R.P[0].closed.length % 3 === 2) && !G.R.last; }
  function renderHand(){
    const X = G.R.P[0], h = $("hand"); h.innerHTML = "";
    const items = X.closed.map((t, i) => [t, i]);
    if (X.drawn !== null) items.push([X.drawn, 99]);
    const per = 7;
    const rows = [document.createElement("div"), document.createElement("div")];
    rows.forEach(r => r.className = "r");
    const n = items.length;
    items.forEach(([t, i], k) => {
      const el = tileEl(t, (i === 99 ? "drawn" : "") + (sel === i ? " up" : ""));
      el.onclick = () => {
        if (!myTurn()) return;
        if (sel === i){ sel = -1; answer(i); }
        else { sel = i; renderHand(); }
      };
      rows[i !== 99 && k < per ? 0 : 1].appendChild(el);
    });
    h.appendChild(rows[0]); h.appendChild(rows[1]);
    if (!pending || !$("acts").children.length) $("note").textContent = myTurn() ? (sel >= 0 ? "もう一度タップで捨てる" : "1枚選んで捨てる") : "";
  }
  function renderActs(opts, note){
    const a = $("acts"); a.innerHTML = "";
    opts.forEach(o => {
      const b = document.createElement("button"); b.type = "button"; b.className = o.cls || "";
      b.appendChild(document.createTextNode(o.label));
      if (o.tiles) o.tiles.forEach((x, i) => b.appendChild(tileEl(x, "mini" + (i === o.got ? " got" : ""))));
      b.onclick = () => answer(o.id);
      a.appendChild(b);
    });
    $("note").style.display = opts.length ? "none" : "";
    if (G && G.R) renderHand();
  }
  // ----- 局の終わり -----
  function groupEl(tiles, open){
    const d = document.createElement("div"); d.className = "g" + (open ? " open" : "");
    tiles.forEach(x => d.appendChild(tileEl(x))); return d;
  }
  function showResult(g, out){
    const before = g.scores.slice();
    const gr = $("groups"); gr.innerHTML = "";
    if (out.kind === "flow"){
      $("rHd").textContent = "流局"; $("rSub").textContent = "引く牌が尽きた。点の移動なし";
      $("rYaku").innerHTML = ""; $("rPts").textContent = "";
      S("flow");
    } else {
      const e = out.e;
      if (e.deco.special) gr.appendChild(groupEl(out.closed));
      else {
        e.deco.sets.forEach(s => gr.appendChild(groupEl(T.meldTiles(s), s.open)));
        gr.appendChild(groupEl([e.deco.pair, e.deco.pair]));
      }
      $("rHd").textContent = `${WHO[out.q]}の上がり`;
      $("rSub").textContent = out.from === null ? "ツモ" : `ロン（${WHO[out.from]}が捨てた牌）`;
      $("rYaku").innerHTML = e.yaku.map(y => `<li><span>${y.name}${y.n > 1 ? " ×" + y.n : ""}</span><span class="pt">${y.pt * 10}</span>${y.note ? `<small>${y.note}</small>` : ""}</li>`).join("");
      $("rPts").textContent = `${e.pts * 10}点`;
      for (let s = 0; s < 4; s++) g.scores[s] += out.d[s];
      S("win");
    }
    $("rMv").innerHTML = [0, 1, 2, 3].map(s => {
      const dv = g.scores[s] - before[s];
      return `<tr${s === 0 ? ' class="me"' : ""}><td>${WHO[s]}</td><td>${g.scores[s]}</td><td class="${dv > 0 ? "p" : dv < 0 ? "n" : ""}">${dv > 0 ? "+" + dv : dv < 0 ? dv : "±0"}</td></tr>`;
    }).join("");
    $("rMv").style.display = out.kind === "flow" ? "none" : "";
    $("rNext").textContent = g.round === ROUNDS - 1 ? "順位を見る" : "次の局";
    render(); $("res").classList.add("on");
    return new Promise(res => { $("rNext").onclick = () => { $("res").classList.remove("on"); res(); }; }).then(() => alive(g));
  }
  function showFinal(g){
    const sc = g.scores, rank = s => 1 + sc.filter(v => v > sc[s]).length;
    const order = [0, 1, 2, 3].sort((a, b) => sc[b] - sc[a] || a - b);
    $("fList").innerHTML = order.map(s => `<tr${s === 0 ? ' class="me"' : ""}><td>${rank(s)}位</td><td>${WHO[s]}</td><td>${sc[s]}点</td></tr>`).join("");
    const first = rank(0) === 1, had = rec.best !== null, high = !had || sc[0] > rec.best;
    if (first) rec.first++;
    if (high) rec.best = sc[0];
    saveRec();
    $("fHd").textContent = first ? "1位！" : `${rank(0)}位`;
    $("fNote").textContent = had && high ? "最高点を更新" : "";   // 初めての1回は前の記録がないので出さない
    $("fin").classList.add("on");
  }
  // ----- 役の一覧 -----
  $("ylBody").innerHTML = T.YAKU.map(y => `<li><span>${y.name}</span><span class="pt">${y.pt * 10}</span><small>${y.cond}</small></li>`).join("");
  $("ylCalc").textContent = "役の点を足す。130点の役は他の役と足さない。ロンは捨てた人が払い、ツモは3人で分けて払う";
  $("yk").onclick = () => $("yakuList").classList.add("on");
  $("ylClose").onclick = () => $("yakuList").classList.remove("on");
  $("yakuList").onclick = e => { if (e.target === $("yakuList")) $("yakuList").classList.remove("on"); };
  // ----- 大きさ：中央の盤を残りの高さと幅に合わせる -----
  function fit(){
    const m = $("mid"); if (!m.clientHeight) return;
    // 盤の幅も高さも 8×(1.36pw+1)＋6×(pw+1)＋6 ＝ 16.88pw＋20
    const pw = Math.max(10, Math.min(26, (m.clientWidth - 20) / 16.88, (m.clientHeight - 20) / 16.88));
    document.documentElement.style.setProperty("--pw", pw.toFixed(2) + "px");
  }
  window.addEventListener("resize", fit);
  // ----- トップ画面 -----
  function renderTop(){
    $("tBest").style.display = rec.best === null ? "none" : "";
    $("tFirst").textContent = `1位 ${rec.first}回`;
    $("tHigh").textContent = `最高点 ${rec.best}点`;
  }
  function showTop(){
    mode = "top"; $("yakuList").classList.remove("on");
    renderTop(); document.body.classList.add("top");
  }
  function play(){
    mode = "play"; document.body.classList.remove("top");
    fit();
    if (!G || G.over) newGame(firstSeed !== null ? firstSeed : newSeed());
    firstSeed = null;
    render();
  }
  $("ttl").onclick = showTop;
  $("tGo").onclick = play;
  $("fAgain").onclick = () => { $("fin").classList.remove("on"); newGame(newSeed()); };
  $("fTop").onclick = () => { $("fin").classList.remove("on"); showTop(); };
  const q = new URLSearchParams(location.search).get("seed");
  let firstSeed = q !== null && /^\d+$/.test(q) ? (Number(q) >>> 0) : null;
  renderTop(); fit();
})();
</script>
</body>
</html>
